name: Export FP32 ZipDepth for WebGPU
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/export_webgpu.py
      - scripts/publish_webgpu.py
      - .github/workflows/export-webgpu.yml
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU export dependencies
        run: |
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.1.3 onnx==1.17.0 onnxruntime==1.20.1 Pillow==11.0.0 huggingface_hub==0.27.1
      - name: Export and compare against original PyTorch inference
        run: python scripts/export_webgpu.py --height 768 --width 768 --output release/zipdepth-base-768-fp32.onnx
      - name: Publish to the persistent Hugging Face model repository
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/publish_webgpu.py
